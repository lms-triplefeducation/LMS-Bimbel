<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | TRIPLE-F EDUCATION</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-brand"><img src="assets/logo.svg" class="auth-logo"><span class="eyebrow">LEARNING MANAGEMENT SYSTEM</span><h1>Belajar Terarah.<br>Berlatih Konsisten.<br>Raih Prestasi.</h1><p>Platform TRIPLE-F EDUCATION untuk siswa, guru, dan admin.</p></section><section class="auth-card"><h2>Masuk ke LMS</h2><p class="muted">Gunakan akun yang sudah terdaftar.</p><form id="loginForm"><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" required></label><button class="btn btn-primary btn-block">Masuk</button></form><button id="demoLoginBtn" class="btn btn-soft btn-block">Lihat Demo Tanpa Supabase</button><a class="back-link" href="index.html">← Kembali</a><div id="loginMessage" class="form-message"></div></section></main><script type="module">import{signIn,demoLogin}from"./js/auth.js";loginForm.onsubmit=async e=>{e.preventDefault();loginMessage.textContent="Memproses...";let r=await signIn(email.value,password.value);loginMessage.textContent=r.message;if(r.ok)location.href="dashboard.html"};demoLoginBtn.onclick=()=>{demoLogin("admin");location.href="dashboard.html"}</script></body></html>
